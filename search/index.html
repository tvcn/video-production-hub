  <script>
  (function(){
    var index=[{"id":"path-live-film","title":"14 天真人短片","summary":"用 2–4 人小组、一台相机和一支麦，在 14 天里走完定范围、分镜、勘景、通告、拍摄、后期和交付。","site":"main","url":"/article/path-live-film/"},{"id":"path-story","title":"故事、编剧与分镜","summary":"把“有个想法”变成一句能复述的话、三场有变化的戏、8–12 个能执行的镜头，再用一次读稿把解释删掉。","site":"main","url":"/article/path-story/"},{"id":"path-post","title":"剪辑、调色与声音","summary":"从素材整理到交付，走一遍可复用的后期流程：先结构，再声音，最后调色，交付前做一次技术检查。","site":"main","url":"/article/path-post/"},{"id":"path-history","title":"影像史","summary":"用四条时间线看懂影像技术解决了什么旧问题：摄影、电影、声音、电视、数字与生成。","site":"main","url":"/article/path-history/"},{"id":"path-literacy","title":"媒介素养","summary":"用一套固定顺序判断一条视频：来源、剪辑、语境、钱、AI 痕迹、图表、权利。先停三秒，再下结论。","site":"main","url":"/article/path-literacy/"},{"id":"path-producing","title":"制片与项目管理","summary":"制片不是订盒饭，是把范围、钱、人、时间、许可和风险锁在同一张表上，知道哪一项超了会停拍。","site":"main","url":"/article/path-producing/"},{"id":"path-distribution","title":"发布与运营","summary":"发布不是上传完就结束：母版、平台规格、标题封面、字幕、SEO、上线和 48 小时复盘，要当成一条流水线。","site":"main","url":"/article/path-distribution/"},{"id":"path-career","title":"职业与接单","summary":"从作品集、showreel、报价、合同到交付和复购，把“会拍”变成可持续接单。","site":"main","url":"/article/path-career/"},{"id":"method-first-idea","title":"只有一个模糊想法","summary":"模糊想法先别写剧本，先写三句“谁想要什么、被什么挡住、输了会怎样”。","site":"main","url":"/article/method-first-idea/"},{"id":"method-no-script","title":"不会写剧本","summary":"不会写剧本就先写八格分镜，每格只写一个动作；动作会逼出对白。","site":"main","url":"/article/method-no-script/"},{"id":"method-no-actor","title":"找不到演员","summary":"找不到演员就先拍手、背影、物件和声音；不露脸也能讲一个完整的人。","site":"main","url":"/article/method-no-actor/"},{"id":"method-one-location","title":"只有一个房间","summary":"一个房间也能拍，只要让空间在片子进行中改变一次：变乱、变空、变暗。","site":"main","url":"/article/method-one-location/"},{"id":"method-no-light","title":"没有灯怎么拍","summary":"没有灯先用窗、白墙、反光板和手机手电；先找方向，再谈亮度。","site":"main","url":"/article/method-no-light/"},{"id":"method-no-budget","title":"预算为零","summary":"零预算先砍场面，不砍结构；一个能拍完的简单故事，比一个拍不起的好故事强。","site":"main","url":"/article/method-no-budget/"},{"id":"method-shoot-alone","title":"一个人怎么拍","summary":"一个人拍先用固定机位和连续动作；不要同时演、拍、跟焦。","site":"main","url":"/article/method-shoot-alone/"},{"id":"method-phone-only","title":"只有手机","summary":"手机拍片先锁曝光和白平衡，再配一个能固定的东西；稳定和收音比镜头重要。","site":"main","url":"/article/method-phone-only/"},{"id":"method-flat-image","title":"画面很平","summary":"画面平通常不是机器问题，是光没有方向、前后景没有分开。","site":"main","url":"/article/method-flat-image/"},{"id":"method-dark-footage","title":"暗部很脏","summary":"暗部脏先降 ISO、补一点环境光、别硬拉暗部；拉回来的黑是噪点。","site":"main","url":"/article/method-dark-footage/"},{"id":"method-overexposed","title":"高光爆了","summary":"高光爆了先降一档、换 ND、关掉不必要的 practical；爆掉的像素救不回来。","site":"main","url":"/article/method-overexposed/"},{"id":"method-color-cast","title":"颜色偏了","summary":"颜色偏先找白平衡和混合光，不要一上来调色轮；源头不对，越调越脏。","site":"main","url":"/article/method-color-cast/"},{"id":"method-audio-hiss","title":"底噪很大","summary":"底噪大先查房间、空调、线和增益；麦克风最后再换。","site":"main","url":"/article/method-audio-hiss/"},{"id":"method-wind-noise","title":"外景风噪","summary":"外景风噪先给麦克风套防风罩，再找背风处；后期降噪救不回被风吞掉的字。","site":"main","url":"/article/method-wind-noise/"},{"id":"method-actor-stiff","title":"演员很僵","summary":"演员僵先给一个具体任务，再让他走一步；身体动起来，台词才会松。","site":"main","url":"/article/method-actor-stiff/"},{"id":"method-line-flat","title":"台词像念稿","summary":"台词像念稿先删解释、加动作、让演员看着一个人说；不要加更多形容词。","site":"main","url":"/article/method-line-flat/"},{"id":"method-scene-boring","title":"一场戏没变化","summary":"一场戏没变化，就删掉它，或者让一个人得到/失去一样东西。","site":"main","url":"/article/method-scene-boring/"},{"id":"method-story-slow","title":"开头太慢","summary":"开头慢先删前三十秒，从人物已经在做事的地方开始；背景可以后补。","site":"main","url":"/article/method-story-slow/"},{"id":"method-ending-weak","title":"结尾没力","summary":"结尾没力，常常是因为人物没有付出代价；让他选一次，再停。","site":"main","url":"/article/method-ending-weak/"},{"id":"method-too-long","title":"片子太长","summary":"片子太长先找重复：同一个信息出现两次，就删掉较弱的那次。","site":"main","url":"/article/method-too-long/"},{"id":"method-no-coverage","title":"镜头不够剪","summary":"镜头不够剪，是因为每个镜头只拍了一种景别；补全景、近景和插入。","site":"main","url":"/article/method-no-coverage/"},{"id":"method-axis-jump","title":"越轴了","summary":"越轴先回到全景，或者加一个中性镜头；不要硬切两个反方向的脸。","site":"main","url":"/article/method-axis-jump/"},{"id":"method-continuity-break","title":"穿帮了","summary":"穿帮先拍一张现场照，再对道具、衣服、手和桌面；连续性靠记录，不靠记忆。","site":"main","url":"/article/method-continuity-break/"},{"id":"method-transition-jarring","title":"转场很硬","summary":"转场硬先找动作、声音或形状的接点；白闪和推拉只能救一次。","site":"main","url":"/article/method-transition-jarring/"},{"id":"method-pacing-flat","title":"节奏平","summary":"节奏平先改变镜头长度：连续三个同长度镜头，观众就会走神。","site":"main","url":"/article/method-pacing-flat/"},{"id":"method-music-over","title":"音乐盖对白","summary":"音乐盖对白，先把音乐降 6 dB，再检查是不是根本不需要。","site":"main","url":"/article/method-music-over/"},{"id":"method-subtitle-bad","title":"字幕难读","summary":"字幕难读先减字数、提对比、避开嘴和手；不要靠描边加粗解决。","site":"main","url":"/article/method-subtitle-bad/"},{"id":"method-thumbnail-weak","title":"封面没人点","summary":"封面没人点，通常不是不好看，是看不出发生了什么；给一张有动作的脸。","site":"main","url":"/article/method-thumbnail-weak/"},{"id":"method-title-boring","title":"标题没信息","summary":"标题没信息，先写“谁遇到什么结果”；形容词越多，点击越少。","site":"main","url":"/article/method-title-boring/"},{"id":"method-platform-reject","title":"平台不过审","summary":"平台不过审先查画面、文字、音乐和承诺；改一条，不要整片重做。","site":"main","url":"/article/method-platform-reject/"},{"id":"method-client-revision","title":"客户反复改","summary":"客户反复改，先把“目标”写成一句话，再让每次修改对着这句话验收。","site":"main","url":"/article/method-client-revision/"},{"id":"method-deadline","title":"时间不够","summary":"时间不够先砍镜头数和场景数，不砍录音和备份；后期可以省，素材不能少。","site":"main","url":"/article/method-deadline/"},{"id":"method-budget-overrun","title":"预算超了","summary":"预算超了先停非必要设备，再谈人；超支通常不是单价，是范围变了。","site":"main","url":"/article/method-budget-overrun/"},{"id":"method-crew-conflict","title":"现场吵架","summary":"现场吵架先停十分钟，把问题写成“谁在等谁”；不要在人前面分对错。","site":"main","url":"/article/method-crew-conflict/"},{"id":"method-ai-uncanny","title":"AI 画面假","summary":"AI 画面假，先查眼睛、手、口型和运动；这四处一崩，观众立刻出戏。","site":"main","url":"/article/method-ai-uncanny/"},{"id":"method-ai-consistency","title":"AI 角色漂","summary":"AI 角色漂，先做角色卡和三视图，再把同一张参考图带进每个镜头。","site":"main","url":"/article/method-ai-consistency/"},{"id":"method-ai-rights","title":"AI 版权不清","summary":"AI 版权不清，先查训练来源、商用条款和人物授权；不清楚就不要交付。","site":"main","url":"/article/method-ai-rights/"},{"id":"method-portfolio-empty","title":"没有作品集","summary":"没有作品集，先做三条 30 秒的“能力片”：会拍人、会拍物、会讲一件事。","site":"main","url":"/article/method-portfolio-empty/"},{"id":"method-quote-low","title":"报价太低","summary":"报价太低，先算天数、设备、后期和修改次数；低价接单会赶走好客户。","site":"main","url":"/article/method-quote-low/"},{"id":"method-first-client","title":"第一个客户怎么接","summary":"第一个客户从熟人、社区和小商家开始；先给一个具体方案，不要发作品集大海报。","site":"main","url":"/article/method-first-client/"},{"id":"tool-card-basic-kit","title":"最低设备组合","summary":"最低设备组合：能拍的机身、一支标准变焦、一个能固定的三脚架、一支能收音的麦。","site":"main","url":"/article/tool-card-basic-kit/"},{"id":"tool-card-audio-kit","title":"录音入门组合","summary":"录音入门组合：枪麦、领夹、录音机、监听耳机；先保对白，再谈环境。","site":"main","url":"/article/tool-card-audio-kit/"},{"id":"tool-card-lighting-kit","title":"单灯组合","summary":"单灯组合：一盏 COB、一个柔光箱、一块反光板、两个沙袋；先有一个方向。","site":"main","url":"/article/tool-card-lighting-kit/"},{"id":"tool-card-travel-kit","title":"旅拍轻装","summary":"旅拍轻装：一机一镜、小型稳定器、两电池、一块 ND、一个腰包；先能走一天。","site":"main","url":"/article/tool-card-travel-kit/"},{"id":"tool-card-interview-kit","title":"采访双机","summary":"采访双机：A 机中景、B 机近景，外加枪麦和备用领夹；剪辑才有选择。","site":"main","url":"/article/tool-card-interview-kit/"},{"id":"tool-card-live-kit","title":"直播推流","summary":"直播推流：相机、采集卡、有线网络、备用热点、本地录制；先保不中断。","site":"main","url":"/article/tool-card-live-kit/"},{"id":"tool-card-storage-kit","title":"备份三件套","summary":"备份三件套：读卡器、SSD、机械硬盘；当天拷、当天校验、当天异地。","site":"main","url":"/article/tool-card-storage-kit/"},{"id":"tool-card-ai-kit","title":"AI 工作流","summary":"AI 工作流：脚本、参考图、生成工具、放大、合成、标注；每一步都能回退。","site":"main","url":"/article/tool-card-ai-kit/"},{"id":"tool-card-accessibility","title":"无障碍检查","summary":"无障碍检查：字幕、对比度、口述影像、音量、闪烁；交付前逐项过。","site":"main","url":"/article/tool-card-accessibility/"},{"id":"case-vlog","title":"旅拍 Vlog 案例：只拍一个发现","summary":"一条 90 秒旅拍，一个人、两天、一个小镇、一场雨；不拍航拍合集，只拍“去找一件东西”的过程。","site":"main","url":"/article/case-vlog/"},{"id":"case-news","title":"新闻现场案例：先核实，再开机","summary":"一条 90 秒新闻短片，在 6 小时窗口里核对信源、拍证据、标资料画面，最后把未知留在片子里。","site":"main","url":"/article/case-news/"},{"id":"case-music-video","title":"MV 案例：三个母题撑一首歌","summary":"一支 3 分半 MV，5 人、1 天、1 个仓库；不拍剧情，用三个视觉母题跟着歌的结构升级。","site":"main","url":"/article/case-music-video/"},{"id":"case-wedding","title":"婚礼案例：誓言不能补拍","summary":"一场 6 分钟婚礼片，两个机位、12 小时、低照度；先保仪式三件事，再谈情绪和慢动作。","site":"main","url":"/article/case-wedding/"},{"id":"case-experimental","title":"实验影像案例：一条规则，三次重复","summary":"一条 4 分钟实验片：固定机位、一个动作、三次重复、一次打破；声音承担结构，不靠旁白解释。","site":"main","url":"/article/case-experimental/"},{"id":"first-film","title":"7 天第一条片","summary":"用手机或轻便相机，在 7 天里走完定题、分镜、拍摄、粗剪、字幕和复盘，拿到一条能播放的 60–90 秒短片。","site":"main","url":"/article/first-film/"},{"id":"deep-first-film","title":"第一部片：First Film、First Idea、Career","summary":"第一部片不是证明你会拍，而是用一个能完成的项目换到下一次机会。","site":"main","url":"/article/deep-first-film/"},{"id":"deep-client-career","title":"客户与职业：Career、First Client、Quote","summary":"接客户不是报价越低越容易；范围、交付和修改次数决定这是不是一门能持续的生意。","site":"main","url":"/article/deep-client-career/"},{"id":"case-short-drama-composite","title":"短剧案例：三天的钩子与代价","summary":"一个 3 人组、3 天拍摄、5 天后期的竖屏短剧复合复盘：先把 30 秒钩子拍对，再谈反转。","site":"main","url":"/article/case-short-drama-composite/"},{"id":"case-brand-product-composite","title":"产品案例：一句卖点与六个镜头","summary":"一个 30 秒产品广告的复合复盘：六个镜头、一个卖点、一次真实使用，不拍参数堆叠。","site":"main","url":"/article/case-brand-product-composite/"},{"id":"case-documentary-composite","title":"纪录案例：不可重来的九十分钟","summary":"一个 90 分钟纪录片的复合复盘：一次不可重来的现场、两个人物、三条伦理边界。","site":"main","url":"/article/case-documentary-composite/"},{"id":"case-music-performance-composite","title":"MV 案例：现场 Playback 与三条安全线","summary":"一个现场 MV 的复合复盘：playback、机位同步和演员安全三条线，任何一条断了都要停。","site":"main","url":"/article/case-music-performance-composite/"},{"id":"case-vertical-series-composite","title":"竖屏案例：同一场景拍十二集","summary":"一个单场景竖屏系列的复合复盘：用一个房间、两盏灯和三套衣服，拍出十二集的差异。","site":"main","url":"/article/case-vertical-series-composite/"},{"id":"case-event-composite","title":"活动案例：一晚四个环节","summary":"一个单晚活动的复合复盘：四个环节、三台机位、一条时码，先保证每个环节都有完整记录。","site":"main","url":"/article/case-event-composite/"},{"id":"case-interview-composite","title":"访谈案例：四十五分钟一个人","summary":"一个 45 分钟访谈的复合复盘：两个人、三盏灯、一条备份，先把被访者拍舒服。","site":"main","url":"/article/case-interview-composite/"},{"id":"case-corporate-composite","title":"企业案例：工厂与三个部门","summary":"一个企业宣传片的复合复盘：工厂、三个部门、一个真实动作，拒绝把宣传片拍成部门汇报。","site":"main","url":"/article/case-corporate-composite/"},{"id":"case-sports-composite","title":"运动案例：跟拍与安全边界","summary":"一个越野跑跟拍的复合复盘：跟拍、天气和收工边界，先保证人安全，再保证画面。","site":"main","url":"/article/case-sports-composite/"},{"id":"case-food-composite","title":"美食案例：桌面、声音与三十秒","summary":"一个 30 秒美食桌面的复合复盘：一盏窗光、两支麦克风、三个动作，不靠升格堆食欲。","site":"main","url":"/article/case-food-composite/"},{"id":"deep-budget-control","title":"预算控制：报价、预留与超支","summary":"预算不是总价，是每一步谁承担变量；把报价、预留和变更单分开，超支才有位置可查。","site":"main","url":"/article/deep-budget-control/"},{"id":"deep-delivery-risk","title":"交付风险：从母版到客户回执","summary":"交付不是按导出键，是把唯一母版、平台规格、派生版本和客户回执串成一条可追踪的链。","site":"main","url":"/article/deep-delivery-risk/"}];
    var siteName={"main":"主站","story":"故事","shoot":"拍摄","post":"后期","ai":"AI","animation":"动画","formats":"片型","tools":"工具","context":"影像史"};
    var input=document.getElementById('staticSearchInput');
    var out=document.getElementById('staticSearchResults');
    var defaultBox=document.getElementById('searchDefault');
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function syncQuery(){
      var params=new URLSearchParams(location.search);
      var value=input.value.trim();
      if(value) params.set('q',value); else params.delete('q');
      var query=params.toString();
      try{history.replaceState(null,'',location.pathname+(query?'?'+query:''))}catch(e){}
    }
    function render(){
      var q=input.value.trim().toLowerCase();
      if(defaultBox) defaultBox.style.display=q?'none':'';
      if(!q){out.innerHTML='<p class="search-hint">输入关键词开始搜索。</p>';return}
      var all=index.filter(function(x){return (x.title+' '+x.summary+' '+x.site+' '+x.id).toLowerCase().indexOf(q)>=0}); var hits=all.slice(0,24);
      if(!hits.length){out.innerHTML='<div class="empty"><p class="search-hint">没有匹配的文章。</p></div>';return}
      out.innerHTML='<p class="search-count">'+all.length+' 条结果'+(all.length>24?' （显示前 24 条）':'')+'</p><div class="search-results">'+hits.map(function(x){return '<a class="search-result" href="'+x.url+'"><span class="result-type">'+esc(siteName[x.site]||x.site)+'</span><span><span class="result-title">'+esc(x.title)+'</span><span class="result-summary">'+esc(x.summary)+'</span></span></a>'}).join('')+'</div>';
    }
    function update(){render();syncQuery()}
    input.addEventListener('input',update);
    var initial=new URLSearchParams(location.search).get('q');
    if(initial){input.value=initial;render()}
  })();
  </script>
